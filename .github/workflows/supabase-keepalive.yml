name: Supabase Keep-Alive

# Supabase's pause criterion (docs): "a few user requests to the database EACH DAY
# over the previous week." The old every-3-days ping failed the "each day" part and
# triggered a pause warning (Jul 2026). 3 runs/day x 3 DB queries, spread across the
# day, clears "a few each day" with margin.
on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC
    - cron: '0 13 * * *'  # 13:00 UTC
    - cron: '0 20 * * *'  # 20:00 UTC
  workflow_dispatch:       # allow manual trigger

env:
  SUPABASE_URL: https://oomuupminexahfipgktd.supabase.co
  ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vbXV1cG1pbmV4YWhmaXBna3RkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxMDE4MzAsImV4cCI6MjA4OTY3NzgzMH0.SrOKNj7mh_UtP_6PdWx4G7gwR98ya56xL_6e0k3Hxrk

permissions:
  actions: write  # for the self-re-enable step below

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep this cron alive (GitHub auto-disables scheduled workflows after 60 days without repo activity)
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/supabase-keepalive.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Read both tables
        run: |
          for TABLE in move_explanations error_reports; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "$SUPABASE_URL/rest/v1/$TABLE?select=line_id&limit=1" \
              -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY")
            echo "$TABLE read: $STATUS"
            if [ "$STATUS" != "200" ]; then echo "WARNING: Expected 200, got $STATUS - project may be paused"; exit 1; fi
          done
      - name: Write keepalive row (real DB write counts as activity)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/rest/v1/error_reports" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{"line_id":"keepalive","line_name":"keepalive-ping","move_index":0,"status":"resolved"}')
          echo "keepalive insert: $STATUS"
          if [ "$STATUS" != "201" ]; then echo "WARNING: Expected 201, got $STATUS"; exit 1; fi
          echo "OK - Supabase is alive, activity timer reset"
